name: Theme Check

on:
  pull_request:
    paths:
      - 'theme/**'
      - 'scripts/create_mega_menus.js'
      - 'scripts/fix_vendors.js'
      - 'scripts/lib/category_nav_contract.js'
      - 'scripts/verify_category_navigation.js'
      - 'scripts/verify_dynamic_vendor_navigation.js'
      - '.theme-check.yml'
      - '.github/workflows/theme-check.yml'
  push:
    branches:
      - main
    paths:
      - 'theme/**'
      - '.theme-check.yml'

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Theme Check
        run: npx shopify theme check --fail-level error

      - name: Verify child brands and taxonomy collection navigation
        run: |
          node scripts/verify_dynamic_vendor_navigation.js
          node scripts/verify_category_navigation.js
